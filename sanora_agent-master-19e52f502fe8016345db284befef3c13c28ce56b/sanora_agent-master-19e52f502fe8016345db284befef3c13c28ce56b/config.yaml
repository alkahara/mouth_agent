server:
  default_model: "openai"
  default_graph: "dafang_navigation_graph"
  stream_timeout: 30
  max_concurrent_requests: 100


database:
  # PostgreSQL configuration for persistent memory storage (omni_graph 使用)
  # 口腔 V2 专用 PostgreSQL 配置

  mouth_postgres:
    enabled: false
    # host: "192.168.3.200"
    host: "127.0.0.1"
    port: 5432
    database: "mouth_agent_db"
    username: "mouth_user"
    password: "MouthAgentDb@123$" 
    # just for local development
    # enabled: true  # Set to true to enable PostgreSQL persistence
    # host: "192.168.10.232"
    # port: 5432
    # database: "homelab"
    # username: "admin"
    # password: "pg_secret_password" 
  
api:
  rate_limit: 100  # requests per minute
  enable_cors: true
  cors_origins: ["*"]
  
# Authentication
auth:
  require_api_key: true
  default_fallback: false  # If true, allows requests without API key to use default graph

# Phoenix 可观测性配置已移至 .env 文件
# 环境变量: PHOENIX_ENABLED, PHOENIX_COLLECTOR_ENDPOINT, PHOENIX_PROJECT_NAME
