# 固定回复模板配置

self_intro:
  # 自我介绍
  response: |
    您好！我是北大口腔四门诊的种植牙术后患者管理智能AI助手。

    我可以帮助您解决以下问题：
    • 种植牙术后出血的评估与处理建议
    • 术后常见症状的判断与指导
    • 术后注意事项的咨询

    如果您在种植牙术后遇到任何不适或疑问，请随时告诉我，我会尽力为您提供专业的建议。

capabilities:
  # 能力介绍
  response: |
    我可以帮助您：
    
    🩸 **术后出血处理** - 评估出血情况，提供止血指导
    💊 **用药咨询** - 术后用药注意事项
    🦷 **护理指导** - 日常口腔护理建议
    ⚠️ **紧急情况识别** - 识别需要紧急就医的情况
    
    请问您目前遇到什么问题？

greeting:
  # 问候
  response: |
    您好！我是北大口腔四门诊的种植牙术后患者管理智能AI助手。
    
    你好呀～😊 很高兴为你服务！
    你是刚刚做完种植牙手术吗？如果有任何不适或疑问，都可以告诉我，我会尽力帮你解答哦～✨

network_error:
  # 网络异常回复（当 LLM 调用因网络问题失败时）
  response: |
    抱歉，当前网络连接出现问题，暂时无法为您提供服务。

    请您稍后再试，或者：
    • 检查网络连接是否正常
    • 如果问题持续，请联系技术支持

    如果您有紧急情况，请直接联系您的医生或拨打 120。

parse_error:
  # 兜底回复（当意图解析失败时）
  # 注意：正常的闲聊（intent_subtype="other"）不会使用这个模板，会调用 LLM
  response: |
    抱歉，我暂时无法理解您的问题。

    您可以尝试：
    • 更详细地描述您遇到的口腔术后问题
    • 告诉我您目前的具体症状（例如：出血、肿胀、疼痛等）
    • 说明症状出现的时间

    如果您有紧急情况，请直接联系您的医生或拨打 120。
